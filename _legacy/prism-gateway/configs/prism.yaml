# Prism Gateway Configuration
#
# Copy this file to prism.yaml and fill in your API keys.
# Environment variables can be used: ${VAR_NAME}

server:
  http_port: 8080

# ─── Providers ────────────────────────────────────────────
# Each key is a provider ID used in variants below.
providers:
  openai:
    type: openai
    api_key: ${OPENAI_API_KEY}           # set this env var
    base_url: https://api.openai.com/v1
    timeout_ms: 30000
  deepseek:
    type: deepseek
    api_key: ${DEEPSEEK_API_KEY}         # set this env var
    base_url: https://api.deepseek.com
    timeout_ms: 30000

# ─── Models ───────────────────────────────────────────────
# Model definitions for the routing engine.
models:
  - id: gpt-4o
    display_name: GPT-4o
    quality_tier: S
    capabilities:
      max_context_window: 128000
      max_output_tokens: 16384
      supports_streaming: true
      supports_function_calling: true
      supports_vision: true
      supports_json_mode: true
    pricing:
      input_per_1m_tokens: 2.5
      output_per_1m_tokens: 10.0
    specialties: [Reasoning, CodeGeneration]

  - id: gpt-4o-mini
    display_name: GPT-4o Mini
    quality_tier: A
    capabilities:
      max_context_window: 128000
      max_output_tokens: 16384
      supports_streaming: true
      supports_function_calling: true
      supports_vision: true
      supports_json_mode: true
    pricing:
      input_per_1m_tokens: 0.15
      output_per_1m_tokens: 0.6
    specialties: [SimpleQA]

  - id: deepseek-chat
    display_name: DeepSeek V3
    quality_tier: A
    capabilities:
      max_context_window: 128000
      max_output_tokens: 8192
      supports_streaming: true
      supports_function_calling: true
      supports_json_mode: true
    pricing:
      input_per_1m_tokens: 0.27
      output_per_1m_tokens: 1.10
    specialties: [Reasoning, CodeGeneration]

# ─── Variants ─────────────────────────────────────────────
# A variant ties a model to a specific provider.
# Format: model_id@provider_id (convention, not enforced)
variants:
  - id: gpt-4o@openai
    model_id: gpt-4o
    provider_id: openai
  - id: gpt-4o-mini@openai
    model_id: gpt-4o-mini
    provider_id: openai
  - id: deepseek-chat@deepseek
    model_id: deepseek-chat
    provider_id: deepseek

# ─── Pools ────────────────────────────────────────────────
# A pool groups variants that can be selected by the router.
pools:
  - id: default
    name: Default Pool
    variants:
      - gpt-4o@openai
      - gpt-4o-mini@openai
      - deepseek-chat@deepseek

# ─── Routing ──────────────────────────────────────────────
routing:
  default_strategy: balanced
  selector:
    l2: default
    l3: affinity
    l4: best
  balanced:
    cost_weight: 0.3
    quality_weight: 0.5
    latency_weight: 0.2
