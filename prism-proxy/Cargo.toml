[package]
name = "prism-proxy"
version = "0.1.0"
edition = "2021"

[dependencies]
prism-core = { path = "../prism-core" }
pingora = { version = "0.7", features = ["lb", "proxy"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
http = "1"
bytes = "1"
