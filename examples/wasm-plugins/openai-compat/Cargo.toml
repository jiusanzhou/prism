[package]
name = "prism-openai-compat"
version = "0.1.0"
edition = "2021"
description = "Example WASM proxy plugin: OpenAI compatibility layer"

[lib]
crate-type = ["cdylib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
