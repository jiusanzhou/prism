#       poll_interval_secs: 30

# ── Access Log ──────────────────────────────────────────────────
# Envoy-style configurable access logging with %COMMAND_OPERATOR% format.
# 46 operators available — see docs for full list.
access_log:
  enabled: true
  output: both                # stdout | file | both
  file_path: /var/log/prism/access.log
  format: json                # json | text

  # JSON field selection (empty = all default fields).
  # Uncomment to select specific fields:
  # fields:
  #   - "%START_TIME%"
  #   - "%METHOD%"
  #   - "%PATH%"
  #   - "%RESPONSE_CODE%"
  #   - "%RESPONSE_FLAGS%"
  #   - "%DURATION_MS%"
  #   - "%VARIANT%"
  #   - "%PROVIDER%"
  #   - "%MODEL%"
  #   - "%DECISION_TIME_US%"
  #   - "%DOWNSTREAM_REMOTE_ADDRESS%"
  #   - "%REQUEST_ID%"
  #   - "%ERROR%"

  # Text format string (only used when format=text):
  # text_format: "[%START_TIME%] \"%METHOD% %PATH%\" %RESPONSE_CODE% %RESPONSE_FLAGS% %DURATION_MS%ms variant=%VARIANT% provider=%PROVIDER% model=%MODEL% decision=%DECISION_TIME_US%us client=%DOWNSTREAM_REMOTE_ADDRESS% err=%ERROR%"
