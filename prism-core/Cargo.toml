[package]
name = "prism-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["wasmtime"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
rand = "0.8"
regex = "1"
ureq = { version = "2", features = ["json"] }
wasmtime = { version = "24", optional = true }

[dev-dependencies]
