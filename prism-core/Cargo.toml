[package]
name = "prism-core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
wasm = ["wasmtime"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "5"
rand = "0.8"
regex = "1"
ureq = { version = "2", features = ["json"] }
wasmtime = { version = "42", optional = true }
tracing = "0.1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
lru = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "routing"
harness = false
