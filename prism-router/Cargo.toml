[package]
name = "prism-router"
version = "0.1.0"
edition = "2021"

[features]
default = ["grpc", "proxy"]
grpc = ["tonic", "prost", "prost-types"]
proxy = ["pingora", "async-trait", "bytes"]
wasm = ["wasmtime", "prism-core/wasm"]
redis = ["dep:redis"]
usage-db = ["dep:rusqlite"]
usage-pg = ["dep:deadpool-postgres", "dep:tokio-postgres"]
otel = ["dep:opentelemetry", "dep:opentelemetry_sdk", "dep:opentelemetry-otlp", "dep:tracing-opentelemetry"]

[dependencies]
prism-core = { path = "../prism-core" }
arc-swap = "1"
notify = "6"
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dashmap = "6"
serde_yaml = "0.9"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
clap = { version = "4", features = ["derive"] }
http = "1"

# gRPC feature deps
tonic = { version = "0.12", optional = true }
prost = { version = "0.13", optional = true }
prost-types = { version = "0.13", optional = true }

# proxy feature deps
pingora = { version = "0.8", features = ["lb", "proxy", "openssl"], optional = true }
async-trait = { version = "0.1", optional = true }
bytes = { version = "1", optional = true }

# wasm feature deps
wasmtime = { version = "43", optional = true }

# Plugin loader deps
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", features = ["json"] }

# Health checker
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# TLS termination for Axum HTTP server
axum-server = { version = "0.7", features = ["tls-rustls"] }

# Provider plugins (Bedrock SigV4, Vertex JWT)
hmac = "0.12"
jsonwebtoken = "10"

# Access log
chrono = { version = "0.4", features = ["serde"] }


# Redis backend (feature-gated)
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"], optional = true }

# Usage tracking SQLite (feature-gated)
rusqlite = { version = "0.32", features = ["bundled"], optional = true }
deadpool-postgres = { version = "0.14", optional = true }
tokio-postgres = { version = "0.7", optional = true }

[build-dependencies]
tonic-build = "0.12"

# OpenTelemetry (feature-gated)
opentelemetry = { version = "0.29", optional = true }
opentelemetry_sdk = { version = "0.29", features = ["rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.29", features = ["tonic"], optional = true }
tracing-opentelemetry = { version = "0.30", optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
hyper = "1"
tokio-stream = "0.1"
tempfile = "3"
reqwest = { version = "0.12", features = ["json"] }
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "proxy"
harness = false
required-features = ["proxy"]
